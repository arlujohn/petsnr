{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>PetSnR | Items</title>
    <link rel="stylesheet" href="{% static 'styles/styles.css'%}">
    <script src="{% static 'js/script.js' %}"></script>
</head>
<body>
    <img src="{% static 'images/sample-logo.jpg' %}" alt="Petsnr-unofficial-logo">
    <h1>Petsnr - Items Display</h1>
    <ul>
        {% for item in items %}
        <p><b>Item Name:</b> {{item.item_name}}</br> <b>Description:</b> {{item.item_description}}</br> <b>Category:</b> {{item.item_category}}</br> <b>Available in Stock:</b> {{item.item_stock}}</br> <b>Price:</b> ₱{{item.item_price}}</p>
        {% endfor %}
        
    </ul>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
